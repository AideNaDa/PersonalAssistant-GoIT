[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-assistant-bot"
version = "1.0.0"
description = "CLI personal assistant"
requires-python = ">=3.10"

[project.scripts]
assistant-bot = "main:main"

[tool.setuptools]
packages = ["models", "services"]
py-modules = ["main", "cli", "storage"]